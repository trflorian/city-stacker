name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gdscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Check formatting
        run: gdformat --check --line-length 120 .
      - name: Lint
        run: gdlint .
